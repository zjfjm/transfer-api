name = "unlimited-transfer-api"
main = "src/worker.js"
compatibility_date = "2025-11-21"

# This Worker relays Google Gemini API through OpenAI/Anthropic-compatible routes.
#
# Required: your Gemini API key (get one at https://aistudio.google.com/apikey):
#   wrangler secret put GEMINI_API_KEY
#
# Optional: protect this Worker with your own client-facing key:
#   wrangler secret put WORKER_API_KEY
# When WORKER_API_KEY is set, clients must send it as Authorization: Bearer <key>,
# x-api-key: <key>, or anthropic-api-key: <key>. If it is not set, the Worker
# accepts any client key and forwards it upstream as the Gemini key.

[vars]
UPSTREAM_BASE_URL = "https://generativelanguage.googleapis.com/v1beta/openai"
NATIVE_BASE_URL = "https://generativelanguage.googleapis.com/v1beta"
DEFAULT_MODEL = "gemini-2.5-pro"
DEFAULT_CLAUDE_MODEL = "gemini-2.5-pro"
DEFAULT_EMBEDDING_MODEL = "text-embedding-004"
