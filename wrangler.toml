name = "unlimited-transfer-api"
main = "src/worker.js"
compatibility_date = "2025-11-21"

# This Worker relays Google Gemini API through OpenAI/Anthropic-compatible routes.
#
# IMPORTANT: this repository is public. Do NOT write real keys into this file.
# Add them as plain-text Variables in the Cloudflare dashboard instead:
#   Workers & Pages -> your Worker -> Settings -> Variables and Secrets -> Add
#     GEMINI_API_KEY  (required, get one at https://aistudio.google.com/apikey)
#     WORKER_API_KEY  (optional; if set, clients must send it to call the Worker)
# Dashboard variables are applied without redeploying from source and never
# touch this repository. Uncomment below only in a private fork.
#
# GEMINI_API_KEY = ""
# WORKER_API_KEY = ""

[vars]
UPSTREAM_BASE_URL = "https://generativelanguage.googleapis.com/v1beta/openai"
NATIVE_BASE_URL = "https://generativelanguage.googleapis.com/v1beta"
DEFAULT_MODEL = "gemini-2.5-pro"
DEFAULT_CLAUDE_MODEL = "gemini-2.5-pro"
DEFAULT_EMBEDDING_MODEL = "text-embedding-004"
